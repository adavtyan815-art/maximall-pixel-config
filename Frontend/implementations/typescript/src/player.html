<!DOCTYPE HTML>
<html style="width: 100%; height: 100%">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <!-- Optional: apply a font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@600&display=swap" rel="stylesheet">

    <!-- Optional: set some favicons -->
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
	<link rel="icon" type="image/png" sizes="96x96" href="./assets/images/favicon-96x96.png">
	<link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png">

    <!-- Optional: set a title for your page -->
    <title>Pixel Streaming</title>
<style>
#idle-warning-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
#idle-warning-overlay.visible {
    opacity: 1;
    pointer-events: auto;
}
.idle-warning-card {
    background: rgba(28, 28, 35, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
}
.idle-warning-card h2 {
    margin-top: 0;
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #a5a6c5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.idle-warning-card p {
    font-size: 1rem;
    color: #c2c3e3;
    line-height: 1.6;
    margin: 1.5rem 0 2rem 0;
}
#idle-countdown {
    color: #ff5252;
    font-size: 1.4rem;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 82, 82, 0.3);
}
#idle-warning-btn {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    border: none;
    border-radius: 8px;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.8rem 2rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    transition: all 0.2s ease;
    width: 100%;
}
#idle-warning-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
}
#idle-warning-btn:active {
    transform: translateY(1px);
}
</style>
</head>

<!-- The Pixel Streaming player fills 100% of its parent element but body has a 0px height unless filled with content. As such, we explicitly force the body to be 100% of the viewport height -->
<body style="width: 100vw; height: 100svh; min-height: -webkit-fill-available; overflow: hidden; overscroll-behavior: none; font-family: 'Montserrat'; margin: 0px">

<div id="idle-warning-overlay">
    <div class="idle-warning-card">
        <h2>Вы ещё здесь?</h2>
        <p>Сессия закроется через <span id="idle-countdown">30</span> секунд из-за отсутствия активности.</p>
        <button id="idle-warning-btn">Я здесь!</button>
    </div>
</div>

</body>
</html>
